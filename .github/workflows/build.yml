name: Build and Package

on: [push]

# CRITICAL: We need write permissions to create tags and releases
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      # fetch-depth: 0 is required so Git pulls down all previous tags to calculate the next version
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Single File (Compressed)
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true

      - name: Prepare Artifact
        run: |
          mkdir build_package
          
          # Copy the published executable
          copy bin\Release\net10.0-windows\win-x64\publish\ChromiumLauncher.exe build_package\
          
          # Copy all files from the 'PackageExtras' folder into the build package
          copy PackageExtras\* build_package\

      - name: Calculate Next Version Tag
        id: calc_version
        run: |
          # Safely get the latest tag. 'git tag' returns empty (Exit Code 0) if no tags exist, avoiding the error.
          $tags = git tag --list --sort=-v:refname
          $latestTag = if ($tags) { $tags[0] } else { "" }

          # If no tag exists, pretend the last one was 1.0.0
          if ([string]::IsNullOrWhiteSpace($latestTag)) {
              $latestTag = "1.0.0"
          }

          # Split the tag into Major, Minor, and Patch integers
          $parts = $latestTag.Split('.')
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2]

          # Custom Versioning Logic: 1.0.9 -> 1.1.0
          if ($patch -ge 9) {
              $minor++
              $patch = 0
          } else {
              $patch++
          }

          $newTag = "$major.$minor.$patch"
          Write-Host "The new release tag will be: $newTag"
          
          # Safely append to GITHUB_ENV using standard PowerShell commands and forcing UTF8
          Add-Content -Path $env:GITHUB_ENV -Value "NEW_TAG=$newTag" -Encoding utf8
          
          # Force the exit code to 0 to ensure GitHub Actions knows the step succeeded
          $global:LASTEXITCODE = 0
          
      - name: Zip Artifact for Release Page
        run: |
          # Compress the folder so users can easily download a single zip file from the Release page
          Compress-Archive -Path "build_package\*" -DestinationPath "ChromiumLauncher_${{ env.NEW_TAG }}.zip"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use the built-in GitHub CLI to generate the release and upload the zip
          gh release create ${{ env.NEW_TAG }} ChromiumLauncher_${{ env.NEW_TAG }}.zip --title "Release ${{ env.NEW_TAG }}" --generate-notes

      - name: Upload Artifact (Workflow Run)
        uses: actions/upload-artifact@v4
        with:
          name: ChromiumLauncher_Release
          path: build_package/
