name: Build and Package

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Single File (Compressed)
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true

      - name: Prepare Artifact
        run: |
          mkdir build_package
          
          # Copy the published executable
          copy bin\Release\net10.0-windows\win-x64\publish\ChromiumLauncher.exe build_package\
          
          # Copy all files from the 'PackageExtras' folder into the build package
          copy PackageExtras\* build_package\

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChromiumLauncher_Release
          path: build_package/