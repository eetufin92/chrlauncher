# ==========================================
# chrlauncher Configuration File
# ==========================================

# ------------------------------------------
# Main Settings
# ------------------------------------------
# The folder where the browser binaries will be stored and launched from.
# Default: .\bin
ChromiumDirectory=.\bin

# The name of the main browser executable file.
# Default: chrome.exe
ChromiumBinary=chrome.exe

# Command line arguments to pass to the browser when it launches.
# Example: --incognito --force-dark-mode
ChromiumCommandLine=--no-default-browser-check --disable-logging

# ------------------------------------------
# Update Settings
# ------------------------------------------
# How often (in days) the launcher should check for updates.
# Set to 0 to check on every launch. 
# Set to -1 to completely disable update checking.
# Default: 2
ChromiumCheckPeriod=2

# Custom API endpoint for updates. 
# Leave this BLANK to use the built-in GitHub fetcher for ungoogled-chromium.
ChromiumUpdateUrl=

# The architecture of the browser to download if using the built-in GitHub fetcher.
# Valid options: x64, x86, arm64
# Default: x64
ChromiumArchitecture=x64

# Automatically download and maintain the latest Widevine CDM payload
# Valid options: true, false
# Default: false
ChromiumEnableWidevine=false

# A Unix timestamp representing the last time an update was checked/installed.
# The launcher will automatically update this value. Leave it at 0 for a fresh install.
ChromiumLastCheck=0

# ------------------------------------------
# Advanced
# ------------------------------------------
# Set to 'true' to generate a debug.log file next to the executable.
# Useful for troubleshooting paths, network errors, and launch failures.
# Default: false
Debug=false