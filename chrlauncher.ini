[chrlauncher]

# Custom Chromium update URL (string):
# The API endpoint that returns the browser details
ChromiumUpdateUrl=https://api.example.com/check-updates?arch=arm64

# Command line for Chromium (string):
# These flags optimize for portable use and privacy
ChromiumCommandLine=--user-data-dir=..\profile --no-first-run --no-default-browser-check --disable-logging --disable-breakpad --disable-sync

# Chromium executable file name (string):
ChromiumBinary=chrome.exe

# Chromium binaries directory (string):
# Keep your binaries inside a 'bin' folder for a clean root directory
ChromiumDirectory=.\bin

# Check for new Chromium version once in X days (integer):
# 2 -> check updates once in a X days (default)
# 0 -> disable update checking
# -1 -> force update checking
ChromiumCheckPeriod=2
